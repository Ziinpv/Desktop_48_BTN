appId: com.nhom24.luxeweddingstudio
productName: LUXE WEDDING STUDIO
copyright: Copyright © 2026 Nhóm 24 - Hoàng Long
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - electron/**/*
  - package.json
extraResources:
  - from: pyinstaller-dist/luxe-api
    to: luxe-api
win:
  icon: assets/icon.ico
  target:
    - nsis
    - portable
  artifactName: LuxeWeddingStudio-Setup-${version}.${ext}
portable:
  artifactName: LuxeWeddingStudio-Portable-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LUXE WEDDING STUDIO
  installerLanguages:
    - vi
    - en
mac:
  target:
    - dmg
  category: public.app-category.business
linux:
  target:
    - AppImage
  category: Office
